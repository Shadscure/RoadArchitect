name: smoke

on:
  # Push trigger only on the iteration branch — auto-runs each fixup commit.
  # Drop this `push:` block before merging anywhere; production runs should
  # stay on workflow_dispatch.
  push:
    branches:
      - ci/smoke
    paths:
      - '.github/workflows/smoke.yml'
      - 'modules/**'
      - 'gradle.properties'
      - 'build.gradle'
      - 'settings.gradle'
      - 'buildSrc/**'
  workflow_dispatch:
    inputs:
      mc:
        description: 'Minecraft version (must match this branch, e.g. 1.20.1)'
        required: true
        default: '1.20.1'
      loader:
        description: 'Mod loader (forge | neoforge | fabric)'
        required: true
        default: 'forge'
        type: choice
        options:
          - forge
          - neoforge
          - fabric
      wait_seconds:
        description: 'Seconds to keep the game alive before timing out'
        required: false
        default: '180'

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Defaults apply when triggered by push (inputs.* unavailable).
      MC: ${{ inputs.mc || '1.20.1' }}
      LOADER: ${{ inputs.loader || 'forge' }}
      WAIT_SECONDS: ${{ inputs.wait_seconds || '180' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Adoptium temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Gradle itself runs on 21+ (fabric-loom 1.11-SNAPSHOT requires it).
          # The game's runtime JVM is provided by portablemc separately, so the
          # client doesn't care what Gradle uses.
          java-version: '21'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          # Default for non-default-branch workflows is `true` — i.e. cache is
          # read-only on ci/smoke, so nothing ever gets saved and every run
          # cold-resolves Forge userdev. Flip to false so iteration runs
          # populate their own cache for subsequent restores.
          # `cache-cleanup` is left at its default ('on-success'), which
          # already prunes stale Gradle User Home entries before save.
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Install xvfb + portablemc
        env:
          PMC_VERSION: '5.0.3'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          # Prebuilt portablemc binary from upstream releases (rust crate, no cargo build needed)
          mkdir -p /tmp/pmc "$HOME/.local/bin"
          curl -fsSL -o /tmp/pmc.tar.gz \
            "https://github.com/mindstorm38/portablemc/releases/download/v${PMC_VERSION}/portablemc-${PMC_VERSION}-linux-x86_64-gnu.tar.gz"
          tar -xzf /tmp/pmc.tar.gz -C /tmp/pmc
          PMC_BIN="$(find /tmp/pmc -type f -name portablemc -executable | head -1)"
          [[ -x "$PMC_BIN" ]] || { echo "::error::portablemc binary not found in archive"; ls -R /tmp/pmc; exit 1; }
          install -m 0755 "$PMC_BIN" "$HOME/.local/bin/portablemc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/portablemc" --version

      - name: Read versions from gradle.properties
        id: gp
        run: |
          set -euo pipefail
          read_prop() { grep -E "^${1}\s*=" gradle.properties | head -1 | awk -F'=' '{print $2}' | tr -d ' '; }
          MOD_VERSION="$(read_prop mod_version)"
          CLOTH_VERSION="$(read_prop cloth_config_version)"
          case "$LOADER" in
            forge)    LOADER_VERSION="$(read_prop forge_version)" ;;
            neoforge) LOADER_VERSION="$(read_prop neoforge_version)" ;;
            fabric)   LOADER_VERSION="$(read_prop fabric_loader_version)" ;;
          esac
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "cloth_version=$CLOTH_VERSION" >> "$GITHUB_OUTPUT"
          echo "loader_version=$LOADER_VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::mod=$MOD_VERSION  $LOADER=$LOADER_VERSION  cloth=$CLOTH_VERSION"

      - name: Build mod jar
        run: ./gradlew ":modules:${LOADER}:build" --quiet

      - name: Stage test profile (mods + deps)
        id: stage
        run: |
          set -euo pipefail
          TEST_DIR="$RUNNER_TEMP/ra-smoke"
          rm -rf "$TEST_DIR"
          mkdir -p "$TEST_DIR/mods"

          MOD_JAR="$(find "modules/$LOADER/build/libs" -maxdepth 1 -type f \
            -name "*${{ steps.gp.outputs.mod_version }}*.jar" \
            ! -name '*-sources*' ! -name '*-dev*' \
            -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          [[ -f "$MOD_JAR" ]] || { echo "::error::no built jar matched ${{ steps.gp.outputs.mod_version }} in modules/$LOADER/build/libs"; ls -la "modules/$LOADER/build/libs" || true; exit 1; }
          cp "$MOD_JAR" "$TEST_DIR/mods/"
          echo "mod jar: $(basename "$MOD_JAR")"

          CLOTH_DIR="$HOME/.gradle/caches/modules-2/files-2.1/me.shedaniel.cloth/cloth-config-${LOADER}/${{ steps.gp.outputs.cloth_version }}"
          CLOTH_JAR="$(find "$CLOTH_DIR" -name '*.jar' ! -name '*-sources*' 2>/dev/null | head -1 || true)"
          [[ -f "$CLOTH_JAR" ]] || { echo "::error::cloth-config-${LOADER}-${{ steps.gp.outputs.cloth_version }} not in gradle cache"; exit 1; }
          cp "$CLOTH_JAR" "$TEST_DIR/mods/"
          echo "cloth: $(basename "$CLOTH_JAR")"

          if [[ "$LOADER" == "fabric" ]]; then
            FA_VER="$(grep -E '^fabric_api_version\s*=' gradle.properties | awk -F'=' '{print $2}' | tr -d ' ')"
            FA_JAR="$(find "$HOME/.gradle/caches/modules-2/files-2.1/net.fabricmc.fabric-api/fabric-api/$FA_VER" -name '*.jar' ! -name '*-sources*' 2>/dev/null | head -1 || true)"
            if [[ -f "$FA_JAR" ]]; then
              cp "$FA_JAR" "$TEST_DIR/mods/"
              echo "fabric-api: $(basename "$FA_JAR")"
            fi
          fi

          echo "test_dir=$TEST_DIR" >> "$GITHUB_OUTPUT"
          ls -la "$TEST_DIR/mods/"

      - name: Compose portablemc target
        id: target
        run: |
          set -euo pipefail
          case "$LOADER" in
            forge)    TARGET="forge::${MC}-${{ steps.gp.outputs.loader_version }}" ;;
            neoforge) TARGET="neoforge:${{ steps.gp.outputs.loader_version }}" ;;
            fabric)   TARGET="fabric:${MC}:${{ steps.gp.outputs.loader_version }}" ;;
          esac
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "::notice::target=$TARGET"

      - name: Launch + watch (early-exit on success/crash, hard cap ${{ env.WAIT_SECONDS }}s)
        run: |
          set -uo pipefail
          LOG="${{ steps.stage.outputs.test_dir }}/launch.log"

          # Crash classes worth gating on. Caused-by chains alone are noisy;
          # the patterns below are concrete enough that any real regression
          # produces at least one match.
          CRASH='Failed to create mod|NoSuchMethodError|NoClassDefFoundError|UnsatisfiedLinkError|ModLoadingException|ReportedException|FATAL.*minecraft|Mod requires.*above|Mixin apply failed'
          # Known-safe noise — explicitly suppressed so the broad CRASH regex
          # above keeps catching real classes of the same type elsewhere:
          #   Realms/JWT/auth        — offline-mode auth chains always fail
          #   text2speech/Narrator   — accessibility TTS native (libflite.so)
          #                            absent on hosted runners; unrelated
          NOISE='Realms|SignedJWT|FailedConnection|Authentication|MinecraftClientHttpException|player/attributes|Failed to load realms|FabricMC.*JWT|text2speech|Narrator|libflite|Unable to load library .flite'

          # Background launcher; xvfb-run propagates signals to the JVM child
          # when we send SIGTERM/SIGKILL on early-exit.
          xvfb-run -a portablemc start \
            --main-dir "${{ steps.stage.outputs.test_dir }}" \
            --username SmokeTester \
            "${{ steps.target.outputs.target }}" \
            > "$LOG" 2>&1 &
          LAUNCHER_PID=$!

          START_TS=$(date +%s)
          DEADLINE=$((START_TS + WAIT_SECONDS))
          REASON='deadline'

          # Polling loop — terminates as soon as either decisive signal appears
          # in the log, instead of always waiting the full WAIT_SECONDS window.
          while [[ $(date +%s) -lt $DEADLINE ]]; do
            sleep 3

            if [[ -f "$LOG" ]]; then
              # Hard fail — crash class detected, no point waiting further
              if grep -E "$CRASH" "$LOG" 2>/dev/null | grep -qEv "$NOISE"; then
                REASON='crash'
                break
              fi

              # Hard pass — both health markers seen:
              #   1) [RoadArchitect] log line  → mod's own init code ran
              #   2) texture atlas line        → render thread alive
              if grep -qF '[RoadArchitect]' "$LOG" 2>/dev/null \
                 && grep -qE 'Created: [0-9]+x[0-9]+.*minecraft:textures/atlas' "$LOG" 2>/dev/null; then
                REASON='healthy'
                break
              fi
            fi

            # Process died on its own (clean quit or unhandled crash)
            if ! kill -0 "$LAUNCHER_PID" 2>/dev/null; then
              REASON='self_exit'
              break
            fi
          done

          ELAPSED=$(($(date +%s) - START_TS))

          # Tear down launcher if still running (TERM, brief grace, KILL)
          if kill -0 "$LAUNCHER_PID" 2>/dev/null; then
            kill -TERM "$LAUNCHER_PID" 2>/dev/null || true
            for _ in 1 2 3 4 5; do
              kill -0 "$LAUNCHER_PID" 2>/dev/null || break
              sleep 1
            done
            kill -KILL "$LAUNCHER_PID" 2>/dev/null || true
          fi
          wait "$LAUNCHER_PID" 2>/dev/null || true

          echo "::notice::launcher terminated after ${ELAPSED}s (reason=${REASON})"

          # Final classification — converts loop's REASON into pass/fail
          case "$REASON" in
            healthy)
              RA_INIT="$(grep -F '[RoadArchitect]' "$LOG" | head -1 || true)"
              echo "::notice::PASS — mod inited + render thread alive"
              printf '  RA: %s\n' "$(echo "$RA_INIT" | cut -c1-120)"
              ;;
            crash)
              HITS="$(grep -E "$CRASH" "$LOG" | grep -Ev "$NOISE" | head -10)"
              echo "::error::FAIL — crash patterns detected"
              echo "$HITS" | sed 's/^/  /'
              exit 1
              ;;
            deadline|self_exit)
              # Final pass on the log: did any crash slip in late, and did
              # the mod at least mention itself? Stricter than the old
              # ModLauncher/FabricLoader fallback — those fire even if our
              # mod silently no-op'd.
              FINAL_HITS="$(grep -E "$CRASH" "$LOG" 2>/dev/null | grep -Ev "$NOISE" | head -10 || true)"
              RA_INIT="$(grep -F '[RoadArchitect]' "$LOG" 2>/dev/null | head -1 || true)"
              if [[ -n "$FINAL_HITS" ]]; then
                echo "::error::FAIL — crash patterns detected (final pass)"
                echo "$FINAL_HITS" | sed 's/^/  /'
                exit 1
              fi
              if [[ -z "$RA_INIT" ]]; then
                echo "::error::FAIL — no [RoadArchitect] init line in log within ${ELAPSED}s"
                tail -30 "$LOG" 2>/dev/null | tr -d '\r' | sed 's/^/  /'
                exit 1
              fi
              echo "::notice::PASS — mod inited (render-thread marker not seen; reason=${REASON})"
              printf '  RA: %s\n' "$(echo "$RA_INIT" | cut -c1-120)"
              ;;
          esac

      - name: Upload launch.log
        # `always()` so we get the log on green runs too — useful for
        # confirming what "PASS" actually saw. `if-no-files-found: ignore`
        # silences the warning when an early step (e.g. gradle build) fails
        # before the log file is created.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-log-${{ env.MC }}-${{ env.LOADER }}
          path: ${{ runner.temp }}/ra-smoke/launch.log
          if-no-files-found: ignore
          retention-days: 7
