import java.util.Locale
import org.gradle.api.artifacts.repositories.MavenArtifactRepository

plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
    id "com.modrinth.minotaur" version "2.8.8" apply false
    id 'net.darkhax.curseforgegradle' version '1.1.26' apply false
    id "co.uzzu.dotenv.gradle" version "4.0.0"
}

apply from: "gradle/repository-config.gradle"
apply from: "config.gradle"

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

ext.resolveConfigValue = { Object... rawKeys ->
    List<String> flattened = rawKeys.flatten().findAll { it != null }.collect { it.toString() }
    if (flattened.isEmpty()) {
        return null
    }

    List<String> keys = []
    flattened.each { original ->
        if (!keys.contains(original)) {
            keys << original
        }
        def lower = original.toLowerCase(Locale.ROOT)
        if (!keys.contains(lower)) {
            keys << lower
        }
        def upper = original.toUpperCase(Locale.ROOT)
        if (!keys.contains(upper)) {
            keys << upper
        }
    }

    def envExtension = rootProject.extensions.findByName("env")
    def fetchFromEnvExtension = { ext, key ->
        if (ext == null) {
            return null
        }
        if (ext.metaClass.respondsTo(ext, "isPresent", String) && ext.isPresent(key)) {
            return ext.fetch(key)
        }
        return null
    }

    for (String key : keys) {
        def value = System.getenv(key)
        if (value != null) {
            def trimmed = value.toString().trim()
            if (!trimmed.isEmpty()) {
                return trimmed
            }
        }
    }

    if (envExtension != null) {
        for (String key : keys) {
            def value = fetchFromEnvExtension(envExtension, key)
            if (value != null) {
                def trimmed = value.toString().trim()
                if (!trimmed.isEmpty()) {
                    return trimmed
                }
            }
        }
    }

    for (String key : keys) {
        if (rootProject.hasProperty(key)) {
            def value = rootProject.property(key)
            if (value != null) {
                def trimmed = value.toString().trim()
                if (!trimmed.isEmpty()) {
                    return trimmed
                }
            }
        }
    }

    return null
}

ext.resolveMirrorRepositoryUrl = {
    def mirrorConfig = rootProject.ext.standardRepositoryConfig?.mirror ?: [:]
    def keys = mirrorConfig.envKeys ?: []
    rootProject.ext.resolveConfigValue(keys) ?: mirrorConfig.defaultUrl
}

ext.configureStandardRepositories = { handler, Map options = [:] ->
    def includeGradlePortal = options.containsKey('gradlePluginPortal') ? options.gradlePluginPortal : false
    def includeMavenLocal = options.containsKey('mavenLocal') ? options.mavenLocal : true
    def includeMavenCentral = options.containsKey('mavenCentral') ? options.mavenCentral : true

    def repoConfig = rootProject.ext.standardRepositoryConfig ?: [:]

    def configureCredentials = { MavenArtifactRepository repo, Map credentials ->
        if (!repo || !credentials) {
            return
        }
        def user = credentials.username
        def pass = credentials.password
        def token = credentials.token
        if ((user && pass) || token) {
            repo.credentials {
                username = user ?: 'token'
                password = pass ?: token
            }
        }
    }

    def addMavenRepo = { Map spec ->
        def resolvedUrl = spec?.url ?: spec?.defaultUrl
        if (!resolvedUrl) {
            return
        }
        handler.maven {
            if (spec?.name) {
                name = spec.name
            }
            url = uri(resolvedUrl)
            if (spec?.configure instanceof Closure) {
                spec.configure.delegate = delegate
                spec.configure.resolveStrategy = Closure.DELEGATE_FIRST
                spec.configure.call(delegate)
            }
            if (spec?.credentialsProvider instanceof Closure) {
                def creds = spec.credentialsProvider.call()
                configureCredentials(delegate, creds)
            } else if (spec?.useMavenCredentials) {
                configureCredentials(delegate, rootProject.ext.envConfig?.maven?.releases)
            }
        }
    }

    if (repoConfig.mirror) {
        def mirrorUrl = rootProject.ext.resolveMirrorRepositoryUrl()
        if (mirrorUrl) {
            addMavenRepo(repoConfig.mirror + [url: mirrorUrl])
        }
    }

    if (includeMavenLocal && handler.metaClass.respondsTo(handler, "mavenLocal")) {
        handler.mavenLocal()
    }

    if (includeMavenCentral && handler.metaClass.respondsTo(handler, "mavenCentral")) {
        handler.mavenCentral()
    }

    repoConfig.each { key, spec ->
        if (key == 'mirror') {
            return
        }
        if (spec.type == 'mavenLocal' || spec.type == 'mavenCentral') {
            return
        }
        addMavenRepo(spec)
    }

    if (includeGradlePortal && handler.metaClass.respondsTo(handler, "gradlePluginPortal")) {
        handler.gradlePluginPortal()
    }
}

ext.envConfig = [:]

def resolvedMirrorUrl = rootProject.ext.resolveMirrorRepositoryUrl()
def mavenUsername = rootProject.ext.resolveConfigValue("MAVEN_REPO_USERNAME", "MAVEN_REPO_USER", "MAVEN_USERNAME", "MAVEN_USER")
def mavenPassword = rootProject.ext.resolveConfigValue("MAVEN_REPO_PASSWORD", "MAVEN_PASSWORD")
def mavenToken = rootProject.ext.resolveConfigValue("MAVEN_REPO_TOKEN", "MAVEN_TOKEN")

ext.envConfig.maven = [
        releases: [
                url     : rootProject.ext.resolveConfigValue("MAVEN_REPO_URL", "MAVEN_URL"),
                name    : rootProject.ext.resolveConfigValue("MAVEN_REPO_NAME") ?: "private",
                username: mavenUsername,
                password: mavenPassword,
                token   : mavenToken
        ],
        mirror  : [
                url     : resolvedMirrorUrl,
                username: mavenUsername,
                password: mavenPassword,
                token   : mavenToken
        ]
]

ext.envConfig.curseforge = [
        token    : rootProject.ext.resolveConfigValue("CURSEFORGE_TOKEN"),
        projectId: rootProject.ext.resolveConfigValue(["CURSEFORGE_PROJECT", "CURSEFORGE_PROJECT_ID", "curseforge_project"]) ?: "1326434"
]

ext.envConfig.modrinth = [
        token: rootProject.ext.resolveConfigValue("MODRINTH_TOKEN")
]

// ====================== Maven (.env) ====================
// ---- helpers for Maven repository configuration ----
ext.resolveMavenRepoUrl = {
    rootProject.ext.envConfig.maven.releases.url
}

ext.resolveMavenRepoUsername = {
    rootProject.ext.envConfig.maven.releases.username
}

ext.resolveMavenRepoPassword = {
    rootProject.ext.envConfig.maven.releases.password
}

ext.resolveMavenRepoToken = {
    rootProject.ext.envConfig.maven.releases.token
}

ext.resolveMavenRepoName = {
    rootProject.ext.envConfig.maven.releases.name ?: "private"
}

// ====================== CurseForge ====================
ext.resolveCurseforgeToken = {
    rootProject.ext.envConfig.curseforge.token
}

ext.resolveCurseforgeProjectId = { String platform = null ->
    rootProject.ext.envConfig.curseforge.projectId ?: "1326434"
}

tasks.register("publishCurseForgeAll") {
    ["fabric", "neoforge"].each { plat ->
        if (findProject(":modules:${plat}") != null) {
            dependsOn(":modules:${plat}:curseforge")
        }
    }
}
// ====================================================

// ====================== Modrinth ====================
ext.resolveModrinthToken = {
    rootProject.ext.envConfig.modrinth.token
}

tasks.register("publishModrinthAll") {
    ["fabric", "neoforge"].each { plat ->
        if (findProject(":modules:${plat}") != null) {
            dependsOn(":modules:${plat}:modrinth")
        }
    }
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    // ---- groupId: добавляем сегмент по лоадеру (common/fabric/neoforge/quilt)
    def baseGroup = rootProject.maven_group
    def platforms = ["common", "fabric", "neoforge"]
    if (platforms.contains(project.name)) {
        group = "${baseGroup}.${project.name}"
    }

    base {
        // Имена JAR: beltborne_lanterns-<platform>
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories { repoHandler ->
        rootProject.ext.configureStandardRepositories(repoHandler)
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
//        mappings loom.layered {
//            officialMojangMappings()
//        }
        mappings loom.layered {
            it.mappings("net.fabricmc:yarn:$rootProject.yarn_mappings:v2")
            it.mappings("dev.architectury:yarn-mappings-patch-neoforge:$rootProject.yarn_mappings_patch_neoforge_version")
        }
        testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.2"
        testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.2"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // ---- Maven publishing: MC в artifactId суффиксом -mcX.Y, sources/dev — classifier’ы
    publishing {
        def mcTag = "mc" + rootProject.minecraft_version

        publications {
            mavenJava(MavenPublication) {
                def baseId = base.archivesName.get()                 // e.g. beltborne_lanterns-fabric
                artifactId = "${baseId}-${mcTag}"                    // -> beltborne_lanterns-fabric-mc1.21

                if (tasks.findByName('remapJar')) {
                    artifact(tasks.named('remapJar')) {               // runtime jar
                        builtBy(tasks.named('remapJar'))
                    }

                    if (tasks.findByName('remapSourcesJar')) {
                        artifact(tasks.named('remapSourcesJar')) {     // sources
                            classifier = "sources"
                            builtBy(tasks.named('remapSourcesJar'))
                        }
                    } else if (tasks.findByName('sourcesJar')) {
                        artifact(tasks.named('sourcesJar')) {
                            classifier = "sources"
                            builtBy(tasks.named('sourcesJar'))
                        }
                    }
                } else {
                    if (tasks.findByName('jar')) {
                        artifact(tasks.named('jar')) {                 // runtime jar
                            builtBy(tasks.named('jar'))
                        }
                    }
                    if (tasks.findByName('sourcesJar')) {
                        artifact(tasks.named('sourcesJar')) {          // sources
                            classifier = "sources"
                            builtBy(tasks.named('sourcesJar'))
                        }
                    }
                }
                // dev/fat добавим ниже, когда Shadow будет применён
            }
        }

        // Репозиторий — из .env / gradle.properties
        repositories {
            def repoUrl = rootProject.ext.resolveMavenRepoUrl()
            if (repoUrl) {
                maven {
                    name = rootProject.ext.resolveMavenRepoName()
                    url = uri(repoUrl)

                    def user  = rootProject.ext.resolveMavenRepoUsername()
                    def pass  = rootProject.ext.resolveMavenRepoPassword()
                    def token = rootProject.ext.resolveMavenRepoToken()

                    if ((user && pass) || token) {
                        credentials {
                            if (user && pass) {
                                username = user; password = pass
                            } else {
                                username = user ?: 'token'; password = token
                            }
                        }
                    }
                }
            }
        }
    }

    // ---- добавляем dev (shadowJar) как доп. артефакт к mavenJava
    plugins.withId('com.gradleup.shadow') {
        publishing {
            publications {
                named('mavenJava', MavenPublication) {
                    if (tasks.findByName('shadowJar')) {
                        artifact(tasks.named('shadowJar')) {
                            classifier = "dev"        // без MC (он уже в artifactId)
                            builtBy(tasks.named('shadowJar'))
                        }
                    }
                }
            }
        }
    }

    // Ensure JUnit 5 tests are discovered and executed
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events "passed", "skipped", "failed"
            exceptionFormat "short"
        }
    }
}

// Aggregate task to publish all platform modules to Maven
tasks.register("publishMavenAll") {
    ["common", "fabric", "neoforge"].each { plat ->
        if (findProject(":modules:${plat}") != null) {
            dependsOn(":modules:${plat}:publish")
        }
    }
}
