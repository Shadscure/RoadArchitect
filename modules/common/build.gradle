plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = rootProject.neoform_version
    // Make Minecraft available to test sources (BlockPos, NBT, etc.)
    addModdingDependenciesTo sourceSets.test
}

dependencies {
    // Cloth Config API (compile-only — NeoForge variant for Mojmap compatibility)
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}"

    // Caffeine (used by common code; bundled into final jar by loader modules)
    implementation "com.github.ben-manes.caffeine:caffeine:${rootProject.caffeine_version}"

    // Tests
    testImplementation "org.junit.jupiter:junit-jupiter-api:${rootProject.junit_version}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${rootProject.junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}
