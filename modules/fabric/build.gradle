plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

fabricApi {
    configureDataGeneration() {
        client = true
    }
}

sourceSets {
    main {
        resources {
            srcDir "/src/main/generated"
        }
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    // modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"

    modCompileOnly "com.terraformersmc:modmenu:${rootProject.modmenu_version}"
    modRuntimeOnly "com.terraformersmc:modmenu:${rootProject.modmenu_version}"

    common(project(path: ':modules:common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':modules:common', configuration: 'transformProductionFabric')
}

processResources {
    def props = [
            version              : project.version,
            mod_id               : rootProject.findProperty('mod_id'),
            mod_name             : rootProject.findProperty('mod_name'),
            mod_description      : rootProject.findProperty('mod_description'),
            mod_authors          : rootProject.findProperty('mod_authors'),
            mod_homepage         : rootProject.findProperty('mod_homepage'),
            mod_sources          : rootProject.findProperty('mod_sources'),
            mod_license          : rootProject.findProperty('mod_license'),

            minecraft_version    : rootProject.findProperty('minecraft_version'),
            fabric_loader_version        : rootProject.findProperty('fabric_loader_version'),
            modmenu_version      : rootProject.findProperty('modmenu_version'),
            cloth_config_version : rootProject.findProperty('cloth_config_version'),
    ]
    inputs.properties(props)

    filesMatching('fabric.mod.json') {
        expand(props)
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    // roadarchitect-{version}-{for_loader}+{mc_version}
    archiveFileName.set("roadarchitect-${project.version}-fabric+${rootProject.minecraft_version}.jar")
}

def releaseConfig = rootProject.ext.releaseConfig?.fabric ?: [:]
def releaseValue = { value ->
    if (value instanceof Closure) {
        def params = value.maximumNumberOfParameters
        if (params >= 2) {
            return value.call(project, rootProject)
        } else if (params == 1) {
            return value.call(project)
        } else {
            return value.call()
        }
    }
    return value
}

// ====================== Modrinth ====================
apply plugin: "com.modrinth.minotaur"
def modrinthConfig = rootProject.ext.envConfig?.modrinth ?: [:]
def modrinth_token = modrinthConfig.token
boolean hasModrinthToken = modrinth_token != null && !modrinth_token.toString().trim().isEmpty()
if (!hasModrinthToken) {
    logger.warn("MODRINTH_TOKEN is not configured; using a dummy value and disabling Modrinth publishing tasks.")
    modrinth_token = "modrinth_dummy_token"
}

def modrinthRelease = releaseConfig.modrinth ?: [:]
def modrinthProjectId = releaseValue(modrinthRelease.projectId) ?: "dLRvLyY3"
def modrinthVersionNumber = releaseValue(modrinthRelease.versionNumber) ?: "${project.version}-fabric"
def modrinthVersionName = releaseValue(modrinthRelease.versionName) ?: "RoadArchitect v${project.version}+${rootProject.minecraft_version} [Fabric/Quilt]"
def modrinthVersionType = releaseValue(modrinthRelease.versionType) ?: "release"
def modrinthLoaders = (releaseValue(modrinthRelease.loaders) ?: ["fabric", "quilt"]) as List
def modrinthGameVersions = (releaseValue(modrinthRelease.gameVersions) ?: [rootProject.minecraft_version]) as List
def modrinthDependencies = modrinthRelease.dependencies ?: [:]
def modrinthRequiredProjects = (releaseValue(modrinthDependencies.requiredProjects) ?: ["cloth-config"]) as List
def modrinthOptionalProjects = (releaseValue(modrinthDependencies.optionalProjects) ?: []) as List

modrinth {
    token = modrinth_token
    projectId = modrinthProjectId
    versionNumber = modrinthVersionNumber
    versionName   = modrinthVersionName
    versionType   = modrinthVersionType
    gameVersions  = modrinthGameVersions
    loaders       = modrinthLoaders
    uploadFile    = remapJar                   // из Loom
    changelog     = rootProject.file("CHANGELOG.md").exists() ? rootProject.file("CHANGELOG.md").text : ""
    dependencies {
        modrinthRequiredProjects.each { required.project(it) }
        modrinthOptionalProjects.each { optional.project(it) }
    }
}
tasks.configureEach { task ->
    if (task.name.toLowerCase().startsWith("modrinth")) {
        task.onlyIf { hasModrinthToken }
    }
}
// ====================================================

// ====================== CurseForge ====================
apply plugin: "net.darkhax.curseforgegradle"

def curseforgeConfig = rootProject.ext.envConfig?.curseforge ?: [:]
def curse_token = curseforgeConfig.token
boolean hasCurseToken = curse_token != null && !curse_token.toString().trim().isEmpty()
if (!hasCurseToken) {
    logger.warn("CURSEFORGE_TOKEN is not configured; using a dummy value and disabling CurseForge publishing tasks.")
    curse_token = "curseforge_dummy_token"
}

def curseforgeRelease = releaseConfig.curseforge ?: [:]
def curseProjectOverride = releaseValue(curseforgeRelease.projectId)
def curse_project_id = (curseProjectOverride ?: rootProject.ext.resolveCurseforgeProjectId())

def curseDisplayName = releaseValue(curseforgeRelease.displayName) ?: "RoadArchitect v${project.version}+${rootProject.minecraft_version} [Fabric/Quilt]"
def curseReleaseType = releaseValue(curseforgeRelease.releaseType) ?: "release"
def curseModLoaders = (releaseValue(curseforgeRelease.modLoaders) ?: ["Fabric", "Quilt"]) as List
def curseGameVersions = (releaseValue(curseforgeRelease.gameVersions) ?: [rootProject.minecraft_version]) as List
def curseJavaVersions = (releaseValue(curseforgeRelease.javaVersions) ?: ["Java 21"]) as List
def curseEnvironments = (releaseValue(curseforgeRelease.environments) ?: ["Client", "Server"]) as List
def curseRequirements = (releaseValue(curseforgeRelease.requirements) ?: ["cloth-config"]) as List
def curseOptionals = (releaseValue(curseforgeRelease.optionals) ?: []) as List

tasks.register("curseforge", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    onlyIf { hasCurseToken }
    apiToken = curse_token

    disableVersionDetection()

    // основной артефакт из Loom
    dependsOn remapJar
    def mainFile = upload(curse_project_id as String, remapJar)

    // метаданные
    mainFile.displayName = curseDisplayName
    mainFile.releaseType = curseReleaseType
    curseModLoaders.each { mainFile.addModLoader(it) }
    curseGameVersions.each { mainFile.addGameVersion(it) }
    curseJavaVersions.each { mainFile.addJavaVersion(it) }
    curseEnvironments.each { mainFile.addEnvironment(it) }
    mainFile.changelog = rootProject.file("CHANGELOG.md"); mainFile.changelogType = "markdown"
    curseRequirements.each { mainFile.addRequirement(it) }
    curseOptionals.each { mainFile.addOptional(it) }
}
tasks.configureEach { task ->
    if (task.name.toLowerCase().startsWith("curseforge")) {
        task.onlyIf { hasCurseToken }
    }
}
