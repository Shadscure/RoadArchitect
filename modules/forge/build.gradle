import net.darkhax.curseforgegradle.TaskPublishCurseForge

architectury {
    platformSetupLoomIde()
    forge()
}

apply plugin: "com.gradleup.shadow"

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    // Ensure we don't relocate Minecraft or other mod classes
    archiveClassifier = 'dev-shadow'
}

sourceSets {
    main {
        resources {
            srcDir "src/main/generated"
        }
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.minecraft_version-$rootProject.forge_version" //21

    implementation "me.shedaniel.cloth:cloth-config-forge:${rootProject.cloth_config_version}"

    common(project(path: ':modules:common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':modules:common', configuration: 'transformProductionForge')
}


processResources {
    def props = [
            version              : project.version,
            mod_id               : rootProject.findProperty('mod_id'),
            mod_name             : rootProject.findProperty('mod_name'),
            mod_description      : rootProject.findProperty('mod_description'),
            mod_authors          : rootProject.findProperty('mod_authors'),
            mod_homepage         : rootProject.findProperty('mod_homepage'),
            mod_sources          : rootProject.findProperty('mod_sources'),
            mod_license          : rootProject.findProperty('mod_license'),

            minecraft_version    : rootProject.findProperty('minecraft_version'),
            forge_version        : rootProject.findProperty('forge_version'),
            cloth_config_version : rootProject.findProperty('cloth_config_version'),
    ]
    inputs.properties(props)

    filesMatching('META-INF/mods.toml') {
        expand(props)
    }
}

// Make remapJar depend on shadowJar so the shadowed classes get remapped
tasks.named('remapJar') {
    dependsOn(tasks.named('shadowJar'))
    // Use the shadowJar output as input
    inputFile.set(tasks.named('shadowJar').get().archiveFile)
}



// ====================== CurseForge ====================
apply plugin: "net.darkhax.curseforgegradle"

def curse_project_id = 
        (findProperty("curseforge_project_forge")
                ?: System.getenv("CURSEFORGE_PROJECT_FORGE")
                ?: findProperty("curseforge_project")
                ?: System.getenv("CURSEFORGE_PROJECT_ID")
                ?: "1326434")

tasks.register("curseforge", TaskPublishCurseForge) {

    disableVersionDetection()

    dependsOn remapJar
    def mainFile = upload(curse_project_id as String, remapJar)

    mainFile.displayName = "RoadArchitect v${project.version}+${rootProject.minecraft_version} [Forge]"
    mainFile.releaseType = "release"
    mainFile.addModLoader("Forge")
    mainFile.addGameVersion("${rootProject.minecraft_version}")
    mainFile.addJavaVersion("Java 17")
    mainFile.addEnvironment("Client", "Server")
    mainFile.changelog = rootProject.file("CHANGELOG.md"); mainFile.changelogType = "markdown"
    mainFile.addRequirement("cloth-config")
}